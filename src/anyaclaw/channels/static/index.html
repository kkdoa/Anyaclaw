<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<title>Anyaclaw · 控制台</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app" id="app">
  <div class="scrim" id="scrim"></div>

  <aside class="sidebar" id="sidebar" aria-label="会话导航">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">C</div>
      <div class="brand-text">
        <strong>Anyaclaw</strong>
        <span>本地 Agent 控制台</span>
      </div>
      <button class="icon-btn sidebar-close" id="sidebarClose" type="button" aria-label="收起侧栏">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <button class="btn btn-primary new-chat" id="newChatBtn" type="button">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      新建对话
    </button>

    <div class="session-scroll">
      <div class="list-label">
        <span>会话</span>
        <span class="list-count" id="sessionCount">0</span>
      </div>
      <nav class="session-list" id="sessionList" aria-label="历史会话"></nav>
    </div>

    <div class="sidebar-status">
      <div class="status-line">
        <span class="dot" id="healthDot" title="健康状态"></span>
        <span class="status-text" id="healthText">连接中…</span>
        <span class="spacer"></span>
        <span class="ver" id="versionText">—</span>
      </div>
      <div class="status-line muted">
        <span class="k">模型</span>
        <code class="v" id="modelName" title="">—</code>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menuBtn" type="button" aria-label="打开侧栏">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="title-wrap">
        <h1 id="sessionTitle">新对话</h1>
        <span class="sub" id="sessionMeta">web</span>
      </div>
      <div class="topbar-actions">
        <button class="btn" id="cancelBtn" type="button" hidden>取消</button>
        <button class="btn" id="toolsBtn" type="button">工具</button>
        <button class="btn" id="metricsBtn" type="button">指标</button>
      </div>
    </header>

    <section class="messages" id="messages" aria-live="polite" aria-label="消息记录"></section>

    <footer class="composer">
      <div class="composer-inner">
        <div class="chips" id="attachmentList" hidden></div>
        <div class="composer-box">
          <textarea id="input" rows="1" placeholder="给 Agent 发消息…" spellcheck="false" autocomplete="off"></textarea>
          <div class="composer-actions">
            <button class="icon-btn" id="attachBtn" type="button" title="上传附件" aria-label="上传附件">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 11.5l-8.3 8.3a5.6 5.6 0 01-7.9-7.9l8.6-8.6a3.7 3.7 0 015.2 5.2l-8.5 8.5a1.8 1.8 0 01-2.6-2.6l7.8-7.8"/></svg>
            </button>
            <span class="spacer"></span>
            <button class="btn btn-primary" id="sendBtn" type="button">发送</button>
            <button class="btn btn-danger" id="stopBtn" type="button" hidden>停止</button>
          </div>
        </div>
        <p class="composer-hint" id="composerHint">Enter 发送 · Shift+Enter 换行 · 支持上传附件</p>
      </div>
      <input type="file" id="fileInput" multiple hidden>
    </footer>
  </main>
</div>

<aside class="drawer" id="drawer" aria-hidden="true" aria-label="详情面板">
  <div class="drawer-head">
    <h2 id="drawerTitle">指标</h2>
    <button class="icon-btn" id="drawerClose" type="button" aria-label="关闭面板">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<script src="/static/app.js" defer></script>
</body>
</html>
