# Offline demo configuration: pairs with examples/mock_openai_server.py
#   python examples/mock_openai_server.py
#   anyaclaw serve --config examples/config.mock.toml --no-cli
# Then open http://127.0.0.1:8081

[provider]
api_key = "mock-key"
base_url = "http://127.0.0.1:8001/v1"
model = "mock-model"
temperature = 0.2
max_retries = 1
timeout = 30

[agent]
max_iterations = 6
tool_timeout = 30

[storage]
data_dir = "./demo-data"

[security]
workspace = "./demo-workspace"
tool_policy = "allow"
auto_approve = true

[web]
enabled = true
host = "127.0.0.1"
port = 8081

[channels.cli]
enabled = true

[tools]
files = true
shell = false
web = false
memory = true
documents = true
mcp = false
